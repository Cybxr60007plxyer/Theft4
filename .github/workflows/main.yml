name: Build Theft4 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build IPA Package
        run: |
          mkdir -p build
          xcodebuild -workspace Theft4.xcworkspace -scheme Theft4 -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO archive -archivePath build/Theft4.xcarchive
          mkdir -p build/Payload
          cp -r build/Theft4.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r Theft4.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-IPA
          path: build/Theft4.ipa
